name: nexushub

services:
  nexushub-mysql:
    image: mysql:8.4
    container_name: nexushub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXUSHUB_DB_PASSWORD:?Set NEXUSHUB_DB_PASSWORD in .env}
      MYSQL_DATABASE: nexushub
      TZ: Asia/Shanghai
    ports:
      - "${NEXUSHUB_DB_HOST_PORT:-3307}:3306"
    volumes:
      - nexushub-mysql-data:/var/lib/mysql
      - ./doc/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./doc/database/seed-test.sql:/docker-entrypoint-initdb.d/02-seed-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  nexushub-backend:
    build:
      context: ./backend
    container_name: nexushub-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NEXUSHUB_DB_HOST: nexushub-mysql
      NEXUSHUB_DB_PORT: 3306
      NEXUSHUB_DB_USERNAME: root
      NEXUSHUB_DB_PASSWORD: ${NEXUSHUB_DB_PASSWORD:?Set NEXUSHUB_DB_PASSWORD in .env}
      NEXUSHUB_COOKIE_SECURE: ${NEXUSHUB_COOKIE_SECURE:-false}
    ports:
      - "${NEXUSHUB_BACKEND_PORT:-8080}:8080"
    depends_on:
      nexushub-mysql:
        condition: service_healthy

  nexushub-frontend:
    build:
      context: ./frontend
    container_name: nexushub-frontend
    restart: unless-stopped
    ports:
      - "${NEXUSHUB_FRONTEND_PORT:-5173}:80"
    depends_on:
      - nexushub-backend

volumes:
  nexushub-mysql-data:
